<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 353" width="660" height="353" role="img" aria-labelledby="title description">
<title id="title">Changes to Westfield Square</title>
<desc id="description">Westfield Square, north at the top. A shared street (Oak Road) runs across the south in both 2010 and 2025. In 2010 a car park occupied the north-west, with a lawn to the north-east; a market hall stood in the south-west, with a pond to its east. In 2025 the car park was replaced by a community garden and the lawn by a play area. A café replaced the market hall, while the pond stayed in place. A new east–west footpath separates the northern and southern halves of the square; it did not exist in 2010.</desc>
