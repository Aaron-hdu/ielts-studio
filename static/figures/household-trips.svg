<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-labelledby="title description">
<title id="title">How Elwick residents travelled</title>
<desc id="description">Percentage of household trips by main travel mode in the fictional city of Elwick. 2008, 2016, 2024 respectively. Car 55%, 48%, 38%; bus 25%, 27%, 29%; walking 15%, 16%, 19%; bicycle 5%, 9%, 14%. Each year sums to 100%.</desc>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="660" height="330" rx="0" fill="#fff" stroke="none"/>
<text x="26" y="36" fill="#24383b" font-size="22" text-anchor="start" font-weight="700">How Elwick residents travelled</text>
<text x="26" y="61" fill="#485b60" font-size="15" text-anchor="start" font-weight="400">Percentage of all household trips, by main means of travel</text>
<rect x="26" y="85" width="608" height="41" rx="4" fill="#e3eeeb" stroke="none"/>
<text x="42" y="112" fill="#116b63" font-size="16" text-anchor="start" font-weight="700">Travel mode</text>
<text x="330" y="112" fill="#116b63" font-size="16" text-anchor="end" font-weight="700">2008</text>
<text x="460" y="112" fill="#116b63" font-size="16" text-anchor="end" font-weight="700">2016</text>
<text x="590" y="112" fill="#116b63" font-size="16" text-anchor="end" font-weight="700">2024</text>
<line x1="26" y1="172" x2="634" y2="172" stroke="#cfdbd8" stroke-width="1" />
<text x="42" y="156" fill="#24383b" font-size="18" text-anchor="start" font-weight="400">Car</text>
<text x="330" y="156" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">55%</text>
<text x="460" y="156" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">48%</text>
<text x="590" y="156" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">38%</text>
<line x1="26" y1="218" x2="634" y2="218" stroke="#cfdbd8" stroke-width="1" />
<text x="42" y="202" fill="#24383b" font-size="18" text-anchor="start" font-weight="400">Bus</text>
<text x="330" y="202" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">25%</text>
<text x="460" y="202" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">27%</text>
<text x="590" y="202" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">29%</text>
<line x1="26" y1="264" x2="634" y2="264" stroke="#cfdbd8" stroke-width="1" />
<text x="42" y="248" fill="#24383b" font-size="18" text-anchor="start" font-weight="400">Walking</text>
<text x="330" y="248" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">15%</text>
<text x="460" y="248" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">16%</text>
<text x="590" y="248" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">19%</text>
<line x1="26" y1="310" x2="634" y2="310" stroke="#cfdbd8" stroke-width="1" />
<text x="42" y="294" fill="#24383b" font-size="18" text-anchor="start" font-weight="400">Bicycle</text>
<text x="330" y="294" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">5%</text>
<text x="460" y="294" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">9%</text>
<text x="590" y="294" fill="#24383b" font-size="18" text-anchor="end" font-weight="400">14%</text>
</g>
</svg>
